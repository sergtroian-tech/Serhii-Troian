<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4F46E5" />
      <stop offset="50%" stop-color="#4338CA" />
      <stop offset="100%" stop-color="#312E81" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#818CF8" />
    </linearGradient>
    <linearGradient id="envelopeTop" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.95" />
      <stop offset="100%" stop-color="#EEF2FF" stop-opacity="0.8" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#1E1B4B" flood-opacity="0.35" />
    </filter>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#6366F1" flood-opacity="0.4" />
    </filter>
  </defs>

  <!-- Squircle Base with smooth rounded corners -->
  <rect x="32" y="32" width="448" height="448" rx="112" fill="url(#bgGrad)" filter="url(#shadow)" />
  
  <!-- Subtle inner border highlight -->
  <rect x="32" y="32" width="448" height="448" rx="112" stroke="#FFFFFF" stroke-opacity="0.15" stroke-width="4" fill="none" />

  <!-- Envelope Body Base -->
  <rect x="100" y="148" width="312" height="216" rx="28" fill="#1E1B4B" fill-opacity="0.25" />
  <rect x="104" y="152" width="304" height="208" rx="24" fill="#312E81" fill-opacity="0.5" stroke="#818CF8" stroke-opacity="0.3" stroke-width="2" />

  <!-- Lower Envelope Fold / Pocket -->
  <path d="M104 336 L216 238 C240 218 272 218 296 238 L408 336" stroke="#C7D2FE" stroke-opacity="0.4" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Top Envelope Flap Geometry (Clean Fold) -->
  <path d="M112 168 L232 268 C246 279 266 279 280 268 L400 168" stroke="url(#envelopeTop)" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Integrated Checkmark / Task Badge overlapping seamlessly -->
  <g filter="url(#glow)">
    <!-- Badge Background Circle/Squircle -->
    <rect x="264" y="254" width="168" height="168" rx="48" fill="#0F172A" stroke="#38BDF8" stroke-width="4" />
    <rect x="272" y="262" width="152" height="152" rx="40" fill="url(#accentGrad)" />
    
    <!-- Bold Pristine Checkmark -->
    <path d="M312 338 L338 364 L388 308" stroke="#FFFFFF" stroke-width="14" stroke-linecap="round" stroke-linejoin="round" />
  </g>

  <!-- Speed / Productivity Dots -->
  <circle cx="152" cy="208" r="8" fill="#A5B4FC" fill-opacity="0.8" />
  <circle cx="188" cy="208" r="8" fill="#A5B4FC" fill-opacity="0.5" />
</svg>
